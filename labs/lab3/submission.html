<!DOCTYPE html>
<!--
    Name: Isaac Richards
    Date: September 30, 2026
    Description: Example form.

    AI-assisted suggestion: ChatGPT created the images and answered questions about code.
-->
<html lang="en">
    <head>
        <style>
            * {
                /*Make sizing include padding and borders.*/
                box-sizing: border-box;
            }

            img {
                max-width: 100%;
                max-height: 100%;
            }

            .col {
                /* border: 1px solid black; */
                display: flex;
                flex-direction: column;
            }

            .row {
                /* border: 1px solid black; */
                display: flex;
                flex-direction: row;
            }

            /* Not used anymore, but might use it later. 
            .text_button {
                padding: 1% 2% 3%;
                height: 100%;
                aspect-ratio: 1/1;
                line-height: 1;
                text-box: trim-both cap alphabetic;
            } */

            .img_button {
                padding: 2px 2px;
                height: 100%;
                flex: 0 0 auto;
                display: flex;
                justify-content: center;/*X justify*/
                align-items: center;/*Y justify*/
            }
        </style>
        <title>Baking with Fire Form</title>
    </head>
    <body style="margin: 0;"><!-- Remove the default margin -->
        <div
            id="page_container"
            class="col"
            style="
                height: 100dvh;
            ">
            <div
                id="top_bar"
                class="row"
                style="
                    border: 1px solid black;
                    height: 10%;
                    align-items: center;/*Y justify, not really needed here, but goot to have in rows in general.*/
                ">
                <div 
                    id="logo_container"
                    style="
                        /* border: 1px solid black; */
                        max-width: 30%;
                        height: 100%;
                        width: fit-content;
                        display: flex;
                        justify-content: center;/*X justify*/
                        align-items: center;/*Y justify*/
                    ">
                    <img
                        src="images/logo.png"
                        alt="IntroNest Logo"
                        style="
                            padding: 2% 2%;
                            height: 100%;
                            width: 100%;
                        ">
                </div>
                <div
                    id="top_bar_empty_space"
                    style="
                        /* border: 1px solid black; */
                        height: 100%;
                        flex: 1;/*Fill remaining space*/
                        display: flex;
                        justify-content: center;/*X justify*/
                        align-items: center;/*Y justify*/
                    ">
                    <h1>Submit your own recipe</h1>
                </div>
                <div
                    id="top_bar_buttons_container"
                    style="
                        /* border: 1px solid black; */
                        max-width: 70%;
                        height: 100%;
                        width: fit-content;
                        display: flex;
                        justify-content: center;/*X justify*/
                        align-items: center;/*Y justify*/
                        padding: 2px 2px;
                        gap: 2px;/*Space between children*/
                    ">
                </div>
            </div>
            <div
                id="main_area"
                style="
                    /* border: 1px solid black; */
                    flex: 1;/*Fill remaining space*/
                ">
                <div
                    id="main_area_padding_row"
                    class="row"
                    style="
                        /* border: 1px solid black; */
                        height: 100%;
                    ">
                     <div class="col"
                        style="
                            width: 10%;
                        ">
                        <!-- Intentionally empty-->
                     </div>
                     <div class="col"
                        style="
                            flex: 1;/*Fill remaining space*/
                        ">
                        <div class="row"
                            style="
                                height: 10%;
                            ">
                            <!-- Intentionally empty -->
                        </div>
                        <form action="index.html" method="get">
                            <div class="col"
                                style="
                                    border: 1px solid black;
                                    flex: 1;/*Fill remaining space*/
                                    justify-content: center;/*X justify*/
                                    align-items: center;/*Y justify*/
                                ">
                                <label for="recipe_name">Recipe Name:</label>
                                <input id="recipe_name" type="text" name="Recipe Name">

                                <label for="instructions">Ingredients and Instructions:</label>
                                <textarea id="instructions" name="Ingredients and Instructions"></textarea>

                                <label for="difficulty">Difficulty:</label>
                                <input id="difficulty" type="radio" name="Difficulty" value="Easy"> Easy
                                <input id="difficulty" type="radio" name="Difficulty" value="Medium"> Medium
                                <input id="difficulty" type="radio" name="Difficulty" value="Hard"> Hard
                                
                                <label for="diet">Dietary Restrictions:</label>
                                <input id="diet" type="checkbox" name="Dietary Restrictions" value="Vegetarian"> Vegetarian
                                <input id="diet" type="checkbox" name="Dietary Restrictions" value="Vegan"> Vegan
                                <input id="diet" type="checkbox" name="Dietary Restrictions" value="Gluten-Free"> Gluten-Free

                                <label for="submit_button">Submit your recipe:</label>
                                <input id="submit_button" type="submit" value="Submit">
                            </div>
                        </form>
                        <div class="row"
                            style="
                                height: 10%;
                            ">
                            <!-- Intentionally empty -->
                        </div>
                     </div>
                     <div class="col"
                        style="
                            width: 40%;
                            display: flex;
                            justify-content: center;/*X justify*/
                            align-items: center;/*Y justify*/
                        ">
                        <img src="images/cookies.png"
                            alt="Name's Profile Picture"
                            style="
                                padding: 10%
                            ">
                     </div>
                     <div class="col"
                        style="
                            width: 10%;
                        ">
                        <!-- Intentionally empty-->
                     </div>
                </div>
            </div>
        </div>
    </body>
</html>
