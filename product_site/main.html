<!DOCTYPE html>
<!--
    Name: Isaac Richards
    Date: September 25, 2026
    Description: Homepage for Bulk Proxy Forge that introduces the site and
    links users to the Add New Deck page.

    AI-assisted suggestion: ChatGPT helped adapt the existing Add New Deck
    layout into a homepage and check the page against the assignment requirements.
-->
<html lang="en">
    <head>
        <title>BPF Main Page</title>
        <link rel="stylesheet" href="css/common.css">
    </head>
    <body style="margin: 0;"><!-- Remove the default margin -->
        <div
            id="page_container"
            class="col"
            style="
                height: 100dvh;
            ">
            <div
                id="top_bar"
                class="row"
                style="
                    border: 1px solid white;
                    height: 10%;
                    align-items: center;/*Y justify, not really needed here, but goot to have in rows in general.*/
                ">
                <div 
                    id="logo_container"
                    style="
                        /* border: 1px solid white; */
                        max-width: 30%;
                        height: 100%;
                        width: fit-content;
                        display: flex;
                        justify-content: center;/*X justify*/
                        align-items: center;/*Y justify*/
                    ">
                    <img
                        src="images/logo.png"
                        alt="Bulk Proxy Forge Logo"
                        style="
                            padding: 2% 2%;
                        ">
                </div>
                <div
                    id="top_bar_empty_space"
                    style="
                        /* border: 1px solid white; */
                        height: 100%;
                        flex: 1;/*Fill remaining space*/
                    ">
                    <!-- Intentionally empty-->
                </div>
                <div
                    id="top_bar_buttons_container"
                    style="
                        /* border: 1px solid white; */
                        max-width: 70%;
                        height: 100%;
                        width: fit-content;
                        display: flex;
                        justify-content: center;/*X justify*/
                        align-items: center;/*Y justify*/
                        padding: 2px 2px;
                        gap: 2px;/*Space between children*/
                    ">
                    <button class="img_button"
                        title="Help"
                        aria-label="Help"
                        type="button"
                        onclick="window.location.href='help.html'"
                        >
                        <img src="images/help.png" alt="">
                    </button>
                    <button class="img_button"
                        title="Discord Server"
                        aria-label="Discord Server"
                        type="button"
                        onclick="window.open('https://discord.gg/au2rCSbG2B', '_blank')"
                        >
                        <img src="images/discord.png" alt="">
                    </button>
                </div>
            </div>
            <div
                id="main_area"
                style="
                    /* border: 1px solid white; */
                    flex: 1;/*Fill remaining space*/
                ">
                <div
                    id="main_area_padding_row"
                    class="row"
                    style="
                        /* border: 1px solid white; */
                        height: 100%;
                    ">
                     <div class="col"
                        style="
                            width: 10%;
                        ">
                        <!-- Intentionally empty-->
                     </div>
                     <div class="col"
                        style="
                            flex: 1;/*Fill remaining space*/
                        ">
                        <div class="row"
                            style="
                                height: 10%;
                            ">
                            <!-- Intentionally empty -->
                        </div>
                        <div class="col"
                            style="
                                border: 1px solid white;
                                flex: 1;/*Fill remaining space*/
                                padding: 0 8px;
                            ">
                            <div class="row">
                                <h1>
                                    Bulk Proxy Forge
                                </h1>
                            </div>
                            <div class="row">
                                <p>
                                    Bulk Proxy Forge turns a deck list into printable proxy cards.
                                    <strong>Create an entire deck at once</strong> instead of preparing
                                    every card individually.
                                </p>
                            </div>
                            <div class="row">
                                <p>
                                    Start with a deck link and follow a few simple steps to create cards
                                    that are <em>ready for printing</em>.
                                </p>
                            </div>
                            <div class="row"
                                style="
                                    padding: 8px 4px;
                                ">
                                <div class="col"
                                    style="
                                        width: 20%;
                                    ">
                                    <!-- Intentionally empty -->
                                </div>
                                <div class="col"
                                    style="
                                        flex: 1;/*Fill remaining space*/
                                    ">
                                    <a href="add_new_deck.html"
                                        style="
                                            border: 1px solid white;
                                            padding: 2% 4%;
                                            width: 100%;
                                            align-content: center;/*Y justify*/
                                            text-align: center;
                                            text-decoration: none;
                                        ">
                                        Add New Deck
                                    </a>
                                </div>
                                <div class="col"
                                    style="
                                        width: 20%;
                                    ">
                                    <!-- Intentionally empty -->
                                </div>
                            </div>
                            <hr style="width: 100%;">
                            <div
                                id="tutorial_video_container"
                                style="
                                    height: 100%;
                                ">
                                <iframe 
                                    src="https://www.youtube.com/embed/VNkNEovQQr0"
                                    title="YouTube video player"
                                    style="
                                        aspect-ratio: 16/9;
                                    ">
                                </iframe>
                            </div>
                        </div>
                        <div class="row"
                            style="
                                height: 10%;
                            ">
                            <!-- Intentionally empty -->
                        </div>
                     </div>
                     <div class="col"
                        style="
                            width: 10%;
                        ">
                        <!-- Intentionally empty-->
                     </div>
                </div>
            </div>
        </div>
    </body>
</html>
